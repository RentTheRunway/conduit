---

version: 2

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: 'ci(gha): [NOJIRA] '
    directory: '/'
    labels:
      - ci
      - github_actions
    open-pull-requests-limit: 10
    schedule:
      day: sunday
      interval: weekly

  - package-ecosystem: maven
    commit-message:
      prefix: 'chore(java): [NOJIRA] '
    directory: '/'
    open-pull-requests-limit: 30
    labels:
      - chore
      - dependencies
      - java
    schedule:
      day: sunday
      interval: weekly
